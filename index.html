   IDEA: un álbum de stickers / tablero de estrellas
   PICTURE: el frasco de estrellas del día que se llena

   LAYOUT: una columna, botones gigantes, barra inferior */
:root{--d:#C2185B;--p:#F48FB1;--m:#F8BBD0;--l:#FCE4EC;--xl:#FFF5F8;--ink:#4A0E2B;--g:#FFC94D;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--xl);color:var(--ink);font:17px/1.4 "Baloo 2","Trebuchet MS",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
header{background:var(--d);color:#fff;padding:calc(var(--st) + 16px) 18px 22px;border-radius:0 0 28px 28px;position:relative}
header h1{margin:0;font-size:30px;line-height:1.05;font-weight:800}
header .sub{margin:4px 0 0;font-size:15px;opacity:.92}
.jar{display:flex;align-items:center;gap:14px;margin-top:14px;background:rgba(255,255,255,.16);border-radius:20px;padding:10px 14px}
.jar .big{font-size:34px;font-weight:800;line-height:1}
.jar .lbl{font-size:13px;opacity:.95}
.meter{flex:1;height:18px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .5s}
main{padding:16px 14px calc(96px + var(--sb));max-width:640px;margin:0 auto}
h2{font-size:22px;margin:6px 4px 10px;color:var(--d);font-weight:800}
.mission{display:grid;user-select:none;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;width:100%;text-align:left;
 background:#fff;border:3px solid var(--m);border-radius:24px;padding:12px;margin-bottom:12px;cursor:pointer;transition:transform .15s}
.mission:active{transform:scale(.97)}
.mission .em{font-size:38px;width:64px;height:64px;display:grid;place-content:center;background:var(--l);border-radius:18px}
.mission b{display:block;font-size:20px;line-height:1.1}
.mission small{color:var(--d);font-weight:700;font-size:14px}
.mission .em{position:relative}
.mission .em::after{content:"🔊";position:absolute;right:-6px;bottom:-6px;font-size:16px;background:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mission.talk{border-color:var(--d);box-shadow:0 0 0 4px var(--m)}
.listen{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;background:var(--d);color:#fff;font-weight:800;font-size:20px;border-radius:24px;padding:14px;margin:4px 0 16px;cursor:pointer;min-height:64px}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:-4px 0 14px}
.word{border:3px solid var(--m);background:#fff;border-radius:20px;padding:10px 4px;text-align:center;cursor:pointer}
.word .e{font-size:34px;line-height:1.1}
.word .es{font-size:21px;font-weight:800;letter-spacing:1px;color:var(--ink);overflow-wrap:anywhere}
.word .en{font-size:14px;font-weight:700;color:var(--d)}
.tl div.ok span{color:#2E7D32}
.tl div.ok s{font-size:11px;color:var(--ink);opacity:.6;display:block;font-weight:500}
.mission small.okt{color:#2E7D32}
.log{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:14px;overflow:hidden}
.log th{background:var(--p);color:#fff;text-align:left;padding:6px 8px;font-size:13px}
.log td{padding:6px 8px;border-bottom:1px dashed var(--m);vertical-align:middle}
.log input[type=time]{font:inherit;font-size:16px;border:2px solid var(--m);border-radius:10px;padding:4px 6px;color:var(--d);font-weight:800;background:var(--xl);min-height:40px}
.tl div.free{background:#FFFBEA;margin:0 -14px;padding:8px 14px}
.tl div{cursor:pointer}
.mission .star{width:58px;height:58px;border-radius:50%;border:3px dashed var(--p);background:#fff;cursor:pointer;padding:0;display:grid;place-content:center;font-size:30px;color:transparent}
.mission.on{border-color:var(--g);background:#FFFBEA}
.mission.on .star{border:0;background:var(--g);color:#fff;animation:pop .45s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.vid{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 14px 4px}
.vid a{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:var(--d);color:#fff;text-decoration:none;font-weight:700;
 padding:10px 14px;border-radius:16px;font-size:15px;min-height:48px}
.vid a::before{content:"▶";font-size:13px;background:#fff;color:var(--d);width:26px;height:26px;border-radius:50%;display:grid;place-content:center;flex:none}
.done-banner{background:var(--g);color:var(--ink);text-align:center;border-radius:24px;padding:16px;font-size:22px;font-weight:800;margin-bottom:14px}
.tl{background:#fff;border-radius:22px;padding:6px 14px;border:2px solid var(--l)}
.tl div{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--m);font-size:15px}
.tl div:last-child{border:0}
.tl span{min-width:58px;font-weight:800;color:var(--d)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.daynav button{width:48px;height:48px;border-radius:50%;border:0;background:var(--l);color:var(--d);font-size:22px;font-weight:800;cursor:pointer}
.daynav .t{text-align:center;font-weight:800;color:var(--d)}
.daynav .t small{display:block;font-size:13px;color:var(--ink);font-weight:500}
.album{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:8px}
.album .h{font-size:12px;text-align:center;font-weight:800;color:var(--d)}
.stk{aspect-ratio:1;border-radius:14px;background:#fff;border:2px dashed var(--m);display:grid;place-content:center;font-size:24px;position:relative}
.stk.full{background:#FFFBEA;border:2px solid var(--g)}
.stk.part{background:var(--l);border-style:solid}
.stk small{position:absolute;bottom:1px;right:4px;font-size:10px;font-weight:800;color:var(--d)}
.stk.today{outline:3px solid var(--d);outline-offset:1px}
.wkrow{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 6px;font-weight:800;color:var(--d)}
.trophy{font-size:22px}
.card{background:#fff;border:2px solid var(--m);border-radius:20px;margin-bottom:10px;overflow:hidden}
.card>button{width:100%;display:flex;gap:10px;align-items:center;padding:12px;border:0;background:none;text-align:left;cursor:pointer}
.date{min-width:54px;text-align:center;background:var(--l);border-radius:14px;padding:4px;font-weight:800;color:var(--d);line-height:1.1}
.date small{display:block;font-size:12px;color:var(--ink)}
.card .body{display:none;padding:0 14px 14px;font-size:15px}
.card.open .body{display:block}
.card .body p{margin:6px 0}
.card .row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--m)}
.card .row span{min-width:84px;font-weight:800;color:var(--d)}
.card .row.k b::after{content:" ☐";color:var(--p)}
.card .row.k.ok b::after{content:" ⭐"}
.box{background:var(--l);border-radius:14px;padding:8px 12px;margin-top:6px}
.wks{scrollbar-width:none;display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.wks button{flex:none;border:2px solid var(--p);background:#fff;color:var(--d);font-weight:800;padding:6px 14px;border-radius:99px;cursor:pointer;min-height:44px}
.wks button.on{background:var(--d);color:#fff;border-color:var(--d)}
.small{font-size:14px;color:var(--ink);opacity:.85}
.btn{border:2px solid var(--d);background:#fff;color:var(--d);font-weight:800;border-radius:16px;padding:10px 16px;cursor:pointer;min-height:48px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--sb));z-index:5}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:var(--ink);opacity:.6;padding:4px;min-height:52px;cursor:pointer}
nav.tabs button b{font-size:24px;line-height:1.1}
nav.tabs button.on{opacity:1;color:var(--d)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.fx span{position:absolute;font-size:30px;animation:fall 1.4s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.modal{position:fixed;inset:0;background:rgba(74,14,43,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal.on{display:flex}
.modal div{background:#fff;border-radius:24px;padding:20px;max-width:340px;text-align:center}
.modal .row2{display:flex;gap:10px;justify-content:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){.fx{display:none}.mission.on .star{animation:none}}

function quality(v){

  if (/es-(ar|419|mx|us|co|cl)/.test(l)) q += 10;

function pickVoices(){

}

  const ls = document.getElementById("listen");
  if (ls) ls.onclick = () => {
    const ms = d.bloques.filter(b => b.k && !st[b.k]).map(b => kidName(b));
    const lbl = idx === todayIdx ? "Hoy es" : "Este día es";
    greeted = true;
    speak(`${saludo()} ${lbl} ${DIAS_L[d.dia]}. ` + (keys(d).length ? (ms.length ? `Te faltan estas misiones: ${ms.join(", ")}. Tocá cada misión para escuchar qué hacer, y cuando termines tocá la estrella.` : "¡Ya completaste todas tus misiones! Ahora podés jugar a lo que quieras.") : "Hoy es día libre. ¡A jugar!"));
  };
  const nb = document.getElementById("notif");
  if (nb) nb.onclick = () => enablePush(nb, document.getElementById("nstat"));
  q("[data-edit]").forEach(inp => inp.onchange = () => {
    const k = inp.dataset.edit; if (!inp.value) return;
    const f = k.slice(0, 10), r = rec(k) || {};
    st[k] = { t: inp.value, f, at: r.at || null, editado: true }; save(); render();
  });
  const cp = document.getElementById("copylog");
  if (cp) cp.onclick = () => {
    const lines = [`Registro de Helena · ${D.WEEKS[wk][0]} (${D.WEEKS[wk][1]})`];
    D.S.slice(wk*7, wk*7+7).forEach(d => d.bloques.filter(b => b.k).forEach(b => {
      lines.push(`${d.dia} ${d.fecha.slice(8,10)}/${d.fecha.slice(5,7)} · ${kidName(b)} · plan ${planStart(b)} · ${st[b.k] ? doneTxt(b, d) : "pendiente"}`);
    }));
    const txt = lines.join("\n");
    try { navigator.clipboard.writeText(txt).then(() => { cp.textContent = "✔ Copiado"; }, () => { cp.textContent = "No se pudo copiar"; }); } catch (e) { cp.textContent = "No se pudo copiar"; }
  };
  q("[data-play]").forEach(b => b.onclick = () => { const S = STYLES[+b.dataset.play]; speak(S.t, null, S); });
  q("[data-pick]").forEach(b => b.onclick = () => {
    styleIdx = +b.dataset.pick; try { localStorage.setItem("helena-voz", styleIdx); } catch (e) {}
    speak("¡Listo! Desde ahora voy a hablar así.", null, STYLES[styleIdx]); render();
  });
  q("[data-w]").forEach(b => b.onclick = () => { wk = +b.dataset.w; render(); });
  q("[data-go]").forEach(b => b.onclick = () => { idx = +b.dataset.go; tab = "hoy"; render(); window.scrollTo(0,0); });
  q("[data-open]").forEach(b => b.onclick = () => { const f = b.dataset.open; opened.has(f) ? opened.delete(f) : opened.add(f); render(); });
  const r = document.getElementById("reset");
  if (r) r.onclick = () => ask("¿Borrar todas las estrellas de Helena?", () => { st = {}; save(); render(); });
}
function notifLabel(){
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) return "Avisos no disponibles en este navegador";
  return Notification.permission === "granted" && localStorage.getItem("helena-push") ? "✅ Avisos activados · probar de nuevo" : "🔔 Activar avisos";
}
async function enablePush(btn, stat){
  const say = t => { if (stat) stat.textContent = t; };
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) { say("Este navegador no permite avisos. En iPhone, abrí la app desde el ícono de la pantalla de inicio."); return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { say("No se dio permiso. Podés habilitarlo en Configuración → Notificaciones."); return; }
    const reg = await navigator.serviceWorker.ready;
    const key = Uint8Array.from(atob(VAPID.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const r = await fetch("/api/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subscription: sub.toJSON() }) });
    if (!r.ok) throw new Error("servidor " + r.status);
    try { localStorage.setItem("helena-push", "1"); } catch (e) {}
    reg.showNotification("⭐ ¡Avisos activados!", { body: "Así le van a llegar los recordatorios a Helena.", icon: "icon-192.png" });
    say("Listo: los avisos quedaron activados en este teléfono.");
    if (btn) btn.textContent = notifLabel();
  } catch (e) { say("No se pudieron activar los avisos (" + (e && e.message ? e.message : e) + ")."); }
}
function ask(t, yes){
  const md = document.getElementById("modal");
  document.getElementById("mtext").textContent = t; md.classList.add("on");
  document.getElementById("mno").onclick = () => md.classList.remove("on");
  document.getElementById("myes").onclick = () => { md.classList.remove("on"); yes(); };
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.t; if (tab === "hoy") idx = todayIdx; if (tab === "semana" || tab === "papis") wk = Math.floor(todayIdx/7);
  render(); window.scrollTo(0,0);
});
render(); mirror();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
}
