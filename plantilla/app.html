    <div class="t">${lbl} ${d.dia} ${d.fecha.slice(8,10)}/${d.fecha.slice(5,7)}${D.WEEKS[d.semana][2] ? `<small>${esc(M.focoLabel)}: ${esc(D.WEEKS[d.semana][2])}</small>` : ""}</div>

  if (ks.length && dn === ks.length) h += `<div class="done-banner">🎉 ¡Día completo! Ganaste el sticker ${STK[idx]}</div>`;
  h += `<button class="listen" id="listen">🔊 Escuchar mi día</button>`;
  h += `<h2>Mis misiones ⭐ ${dn}/${ks.length}</h2>`;
  d.bloques.filter(b => b.k).forEach(b => {
    const on = !!st[b.k], isS = b.k.endsWith(":ses");
    h += `<div class="mission${on?" on":""}" role="button" tabindex="0" data-say="${b.k}" aria-label="Escuchar: ${esc(kidName(b))}">
      <span class="em">${EMOB(b)}</span>
      <span><b>${esc(kidName(b))}</b><small class="${on?"okt":""}">${on ? "✔ " + esc(doneTxt(b, d)) + " · plan " + esc(planStart(b)) : esc(b.hora)}${isS ? " · " + esc(d.ses.tema) : ""}</small></span>
      <button class="star" data-k="${b.k}" aria-label="Marcar estrella">★</button></div>`;
    if (isS) h += vids(d.ses);
    if (b.palabras) h += `<div class="words">${b.palabras.map(w => `<div class="word" role="button" data-w-es="${esc(w[0])}" data-w-en="${esc(w[1])}"><div class="e">${w[2]}</div><div class="es">${esc(w[0])}</div><div class="en">${esc(w[1])}</div></div>`).join("")}</div>`;
  });
  if (!ks.length && d.dia === "Dom") h += `<div class="done-banner">🌸 Hoy es día libre. ¡A jugar!</div>`;
  h += `<h2>Mi día</h2><p class="small">Tocá cualquier momento para escucharlo.</p><div class="tl">${d.bloques.map((b, bi) => ({b, bi})).sort((x, y) => effMin(x.b, d) - effMin(y.b, d) || x.bi - y.bi).map(({b, bi}) => {
    const ok = b.k && st[b.k], moved = ok && rec(b.k) && effHora(b, d) !== planStart(b);
    return `<div data-bi="${bi}" class="${b.libre?"free":""}${ok?" ok":""}"><span>${esc(effHora(b, d))}${moved?`<s>${esc(planStart(b))}</s>`:""}</span>${ok?"✔ ":""}${EMOB(b)} ${esc(b.k && b.k.endsWith(":ses") ? kidName(b) : b.titulo)}</div>`;
  }).join("")}</div>`;
  return h;
}
function viewPremios(){
  let h = `<h2>Mi álbum de stickers</h2><p class="small">Cada día completo pega un sticker. Si la semana tiene 5 días completos, ¡gana un trofeo!</p>`;
  D.WEEKS.forEach((w, wi) => {
    const days = D.S.slice(wi*7, wi*7+7);
    const full = days.filter(d => keys(d).length && dayDone(d) === keys(d).length).length;
    h += `<div class="wkrow"><span>${esc(w[0])} · ${esc(w[1])}</span><span class="trophy">${full >= 5 ? "🏆" : full + "/5"}</span></div><div class="album">`;
    h += ["L","M","M","J","V","S","D"].map(x => `<div class="h">${x}</div>`).join("");
    days.forEach((d, i) => {
      const gi = wi*7+i, ks = keys(d), dn = dayDone(d);
      const cls = !ks.length ? "" : dn === ks.length ? "full" : dn ? "part" : "";
      const em = !ks.length ? "🌸" : dn === ks.length ? STK[gi] : dn ? "⭐" : (gi > todayIdx ? "❔" : "");
      h += `<div class="stk ${cls}${gi===todayIdx?" today":""}">${em}<small>${d.fecha.slice(8,10)}</small></div>`;
    });
    h += `</div>`;
  });
  return h;
}
function wkButtons(){ return `<div class="wks">${D.WEEKS.map((w,i)=>`<button data-w="${i}" class="${i===wk?"on":""}">${esc(w[0])}</button>`).join("")}</div>`; }
function viewSemana(){
  let h = `<h2>Mi semana</h2>` + wkButtons();
  D.S.slice(wk*7, wk*7+7).forEach((d, i) => {
    const gi = wk*7+i, ks = keys(d), dn = dayDone(d);
    h += `<div class="card"><button data-go="${gi}"><div class="date">${d.fecha.slice(8,10)}/${d.fecha.slice(5,7)}<small>${d.dia}</small></div>
      <div style="flex:1"><b>${d.ses ? EMO(D.AREAS[d.ses.area][0]) + " " + esc(d.ses.tema) : (d.dia==="Dom" ? "Día libre 🌸" : "Arranque de la rutina 🌸")}</b><div class="small">${d.plaza?"🛝 Plaza · ":""}${d.clase?"🇬🇧 Clase + tarea · ":""}⭐ ${dn}/${ks.length}</div></div>
      <b style="color:var(--d)">›</b></button></div>`;
  });
  return h;
}
function viewPapis(){
  let h = `<h2>${esc(M.padresTitulo)}</h2><p class="small">${esc(M.padresIntro)}</p><p class="small" style="display:none">Cada sesión dura 20–25 minutos: 5 de video, 15 de actividad y 5 de cierre. Lunes y miércoles la sesión pasa a las 20:00 (después de la clase y el baño) y sigue «Leo y hablo inglés»: lee 3 palabras en español y las dice en inglés (si la maestra dio tarea, se hace ahí). Los links abren YouTube; si tienen YouTube Kids, mejor.</p>` + wkButtons();
  D.S.slice(wk*7, wk*7+7).forEach(d => {
    const s = d.ses, o = opened.has(d.fecha);
    h += `<div class="card${o?" open":""}"><button data-open="${d.fecha}"><div class="date">${d.fecha.slice(8,10)}/${d.fecha.slice(5,7)}<small>${d.dia}</small></div>
      <div style="flex:1"><b>${s ? esc(D.AREAS[s.area][0] + ": " + s.tema) : (d.dia==="Dom" ? "Día libre" : "Arranque de la rutina")}</b><div class="small">⭐ ${dayDone(d)}/${keys(d).length}</div></div><b style="color:var(--d)">${o?"–":"+"}</b></button>
      <div class="body">${s ? `<div class="box"><p><b>Objetivo:</b> ${esc(s.objetivo)}</p><p><b>Actividad (15'):</b> ${esc(s.actividad)}</p>
        <p><b>Cierre (5'):</b> ${esc(s.cierre)}</p><p><b>Materiales:</b> ${esc(s.material)}</p></div>${vids(s)}` : ""}
      ${d.bloques.map(b => `<div class="row${b.k?" k":""}${b.k&&st[b.k]?" ok":""}"><span>${esc(b.hora)}</span><div><b>${esc(b.titulo)}</b>${b.k&&st[b.k]?`<div class="small" style="color:#2E7D32;font-weight:700">✔ ${esc(doneTxt(b, d))}</div>`:""}${b.det?`<div class="small">${esc(b.det)}</div>`:""}</div></div>`).join("")}
      </div></div>`;
  });
  if (M.avisos && /netlify\.app$/.test(location.hostname)) h += `<h2 style="margin-top:22px">🔔 Avisos</h2>
    <div class="box"><p>Le llega una notificación a la hora de cada misión (sesión, plaza, «Leo y hablo») y 15 minutos antes de la clase de inglés, aunque la app esté cerrada.</p>
    <p class="small">En iPhone funciona solo con la app agregada a la pantalla de inicio (iOS 16.4 o más nuevo).</p>
    <p style="text-align:center"><input id="npin" inputmode="numeric" autocomplete="off" placeholder="PIN de avisos" style="font:inherit;font-size:16px;border:2px solid var(--m);border-radius:12px;padding:8px 12px;width:150px;margin-right:6px"><button class="btn" id="notif">${notifLabel()}</button></p><p class="small" id="nstat" style="text-align:center"></p></div>`;
  const rows = [];
  D.S.slice(wk*7, wk*7+7).forEach(d => d.bloques.filter(b => b.k && st[b.k]).forEach(b => rows.push({d, b})));
  h += `<h2 style="margin-top:22px">🕒 Registro de horarios</h2>
    <p class="small">Cada estrella guarda la hora en que se marcó, y esa hora pasa a ser el horario de la tarea en «Mi día». Si la marcaron más tarde, corregí la hora acá.</p>`;
  h += rows.length ? `<table class="log"><thead><tr><th>Día</th><th>Tarea</th><th>Plan</th><th>Hecho</th></tr></thead><tbody>${rows.map(({d, b}) => {
      const r = rec(b.k);
      return `<tr><td>${d.dia} ${d.fecha.slice(8,10)}/${d.fecha.slice(5,7)}</td><td>${EMOB(b)} ${esc(kidName(b))}</td><td>${esc(planStart(b))}</td>
        <td><input type="time" value="${r ? esc(r.t) : ""}" data-edit="${b.k}" aria-label="Hora en que se hizo"></td></tr>`;
    }).join("")}</tbody></table>
    <p style="text-align:center"><button class="btn" id="copylog">📋 Copiar registro de la semana</button></p>`
    : `<div class="box"><p>Todavía no hay tareas marcadas esta semana.</p></div>`;
  h += `<h2 style="margin-top:22px">🔊 Elegí la voz</h2>
    <p class="small">Escuchá los 5 ejemplos y elegí el que más te guste. Se usan las voces que tiene instalado este teléfono. ${SYN ? "" : "<b>Este navegador no tiene voz; abrí la app en Chrome o Safari.</b>"}</p>`;
  if (SYN && !ESV.length) pickVoices();
  STYLES.forEach((S, i) => {
    const v = styleVoice(S);
    h += `<div class="card" style="padding:12px;${i===styleIdx?"border-color:var(--d);border-width:3px":""}">
      <b>${i+1}. ${esc(S.n)}</b> ${i===styleIdx?"✅":""}<div class="small">${esc(S.d)}${v ? " · Voz: " + esc(v.name) : ""}</div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" data-play="${i}">▶ Escuchar</button>
      <button class="btn" style="flex:1;${i===styleIdx?"background:var(--d);color:#fff":""}" data-pick="${i}">${i===styleIdx?"Elegida":"Elegir"}</button></div></div>`;
  });
  h += `<div class="box"><p><b>Para que suene menos robótica:</b></p>
    <p>• <b>iPhone:</b> Configuración → Accesibilidad → Contenido leído → Voces → Español → bajá una voz «Mejorada» o «Premium» (por ejemplo Paulina o Mónica). Después volvé acá y elegí de nuevo.</p>
    <p>• <b>Android:</b> Configuración → Accesibilidad → Salida de texto a voz → Motor de Google → Español (Estados Unidos o España) → bajá una voz de alta calidad.</p>
    <p>• Si no se escucha nada, revisá que el teléfono no esté en silencio.</p></div>`;
  h += `<p style="text-align:center;margin-top:20px"><button class="btn" id="reset">Borrar todas las estrellas</button></p>
    <p class="small" style="text-align:center">Las estrellas se guardan en este teléfono.</p>`;
  return h;
}
function render(){
  const m = document.getElementById("main");
  m.innerHTML = tab === "hoy" ? viewHoy() : tab === "premios" ? viewPremios() : tab === "semana" ? viewSemana() : viewPapis();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const hh = new Date().getHours();
  document.getElementById("hello").textContent = `¡${hh < 13 ? "Buen día" : hh < 20 ? "Buenas tardes" : "Buenas noches"}, ${NAME}! ${M.emoji}`;
  const d = D.S[todayIdx];
  document.getElementById("hsub").textContent = `${d.ses ? "Hoy: " + d.ses.tema : (keys(d).length ? "¡Vamos con tu rutina!" : "Hoy es día libre")} · ${M.lema}`;
  totals(); bind();
}
function bind(){
  const q = s => document.querySelectorAll(s);
  const p = document.getElementById("prev"), n = document.getElementById("next");
  if (p) p.onclick = () => { if (idx > 0) { idx--; render(); } };
  if (n) n.onclick = () => { if (idx < D.S.length-1) { idx++; render(); } };
  const d = D.S[idx];
  const blk = k => d.bloques.find(b => b.k === k);
  q(".mission").forEach(m => m.onclick = () => {
    q(".mission.talk").forEach(x => x.classList.remove("talk")); m.classList.add("talk");
    talk(blk(m.dataset.say).voz, () => m.classList.remove("talk"));
  });
  q(".mission .star").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const k = b.dataset.k;
    if (st[k]) delete st[k]; else { const n = new Date(); st[k] = { t: hhmm(n), f: todayIso, at: n.toISOString() }; }
    save();
    if (st[k]) {
      const full = dayDone(d) === keys(d).length;
      ding(full); rain(full ? 40 : 12, full ? ["⭐","🌸","🎉",STK[idx]] : ["⭐","✨"]);
      setTimeout(() => speak(full ? M.diaCompleto : PRAISE[Math.floor(Math.random()*PRAISE.length)]), 350);
    }
    render();
  });
  q(".word").forEach(w => w.onclick = () => speak(`${w.dataset.wEs.toLowerCase()}. [${w.dataset.wEn}]`));
  q("[data-bi]").forEach(r => r.onclick = () => talk(d.bloques[+r.dataset.bi].voz));
  const ls = document.getElementById("listen");
  if (ls) ls.onclick = () => {
    const ms = d.bloques.filter(b => b.k && !st[b.k]).map(b => kidName(b));
    const lbl = idx === todayIdx ? "Hoy es" : "Este día es";
    greeted = true;
    speak(`${saludo()} ${lbl} ${DIAS_L[d.dia]}. ` + (keys(d).length ? (ms.length ? `Te faltan estas misiones: ${ms.join(", ")}. Tocá cada misión para escuchar qué hacer, y cuando termines tocá la estrella.` : "¡Ya completaste todas tus misiones! Ahora podés jugar a lo que quieras.") : "Hoy es día libre. ¡A jugar!"));
  };
  const nb = document.getElementById("notif");
  if (nb) nb.onclick = () => enablePush(nb, document.getElementById("nstat"));
  q("[data-edit]").forEach(inp => inp.onchange = () => {
    const k = inp.dataset.edit; if (!inp.value) return;
    const f = k.slice(0, 10), r = rec(k) || {};
    st[k] = { t: inp.value, f, at: r.at || null, editado: true }; save(); render();
  });
  const cp = document.getElementById("copylog");
  if (cp) cp.onclick = () => {
    const lines = [`Registro de ${NAME} · ${D.WEEKS[wk][0]} (${D.WEEKS[wk][1]})`];
    D.S.slice(wk*7, wk*7+7).forEach(d => d.bloques.filter(b => b.k).forEach(b => {
      lines.push(`${d.dia} ${d.fecha.slice(8,10)}/${d.fecha.slice(5,7)} · ${kidName(b)} · plan ${planStart(b)} · ${st[b.k] ? doneTxt(b, d) : "pendiente"}`);
    }));
    const txt = lines.join("\n");
    try { navigator.clipboard.writeText(txt).then(() => { cp.textContent = "✔ Copiado"; }, () => { cp.textContent = "No se pudo copiar"; }); } catch (e) { cp.textContent = "No se pudo copiar"; }
  };
  q("[data-play]").forEach(b => b.onclick = () => { const S = STYLES[+b.dataset.play]; speak(S.t, null, S); });
  q("[data-pick]").forEach(b => b.onclick = () => {
    styleIdx = +b.dataset.pick; try { localStorage.setItem(KEY + "-voz", styleIdx); } catch (e) {}
    speak("¡Listo! Desde ahora voy a hablar así.", null, STYLES[styleIdx]); render();
  });
  q("[data-w]").forEach(b => b.onclick = () => { wk = +b.dataset.w; render(); });
  q("[data-go]").forEach(b => b.onclick = () => { idx = +b.dataset.go; tab = "hoy"; render(); window.scrollTo(0,0); });
  q("[data-open]").forEach(b => b.onclick = () => { const f = b.dataset.open; opened.has(f) ? opened.delete(f) : opened.add(f); render(); });
  const r = document.getElementById("reset");
  if (r) r.onclick = () => ask(`¿Borrar todas las estrellas de ${NAME}?`, () => { st = {}; save(); render(); });
}
function notifLabel(){
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) return "Avisos no disponibles en este navegador";
  return Notification.permission === "granted" && localStorage.getItem(KEY + "-push") ? "✅ Avisos activados · probar de nuevo" : "🔔 Activar avisos";
}
async function enablePush(btn, stat){
  const say = t => { if (stat) stat.textContent = t; };
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) { say("Este navegador no permite avisos. En iPhone, abrí la app desde el ícono de la pantalla de inicio."); return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { say("No se dio permiso. Podés habilitarlo en Configuración → Notificaciones."); return; }
    const reg = await navigator.serviceWorker.ready;
    const key = Uint8Array.from(atob(VAPID.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const r = await fetch("/api/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subscription: sub.toJSON(), pin: (document.getElementById("npin") || {}).value || "" }) });
    if (r.status === 403) { say("El PIN no es correcto."); return; }
    if (!r.ok) throw new Error("servidor " + r.status);
    try { localStorage.setItem(KEY + "-push", "1"); } catch (e) {}
    reg.showNotification("⭐ ¡Avisos activados!", { body: `Así van a llegar los recordatorios de ${NAME}.`, icon: "icon-192.png" });
    say("Listo: los avisos quedaron activados en este teléfono.");
    if (btn) btn.textContent = notifLabel();
  } catch (e) { say("No se pudieron activar los avisos (" + (e && e.message ? e.message : e) + ")."); }
}
function ask(t, yes){
  const md = document.getElementById("modal");
  document.getElementById("mtext").textContent = t; md.classList.add("on");
  document.getElementById("mno").onclick = () => md.classList.remove("on");
  document.getElementById("myes").onclick = () => { md.classList.remove("on"); yes(); };
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.t; if (tab === "hoy") idx = todayIdx; if (tab === "semana" || tab === "papis") wk = Math.floor(todayIdx/7);
  render(); window.scrollTo(0,0);
});
document.getElementById("ptabE").textContent = M.padresEmoji; document.getElementById("ptabT").textContent = M.padresTab;
render(); mirror();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
}
